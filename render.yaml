services:
  - type: web
    name: postoperative-followup
    env: docker
    region: singapore
    plan: starter               # free 不支持持久磁盘
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false             # 在 Render 控制台单独填，不入库
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false             # 在 Render 控制台单独填
      - key: DB_NAME
        value: /var/data/db.sqlite3
      - key: MEDIA_ROOT
        value: /var/data/media
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
